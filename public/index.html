<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IMusic</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23fa233b'/><stop offset='100%25' stop-color='%23fb5c74'/></linearGradient></defs><path fill='white' d='M68 25v35.8c-2.3-1.4-5.2-2.3-8.4-2.3-7.5 0-13.6 5-13.6 11.2S52.1 81 59.6 81c7.2 0 13.1-4.6 13.5-10.5h.5V36.7l22-4.5v18.5c-2.3-1.4-5.2-2.3-8.4-2.3-7.5 0-13.6 5-13.6 11.2S79.7 71 87.2 71c7.2 0 13.1-4.6 13.5-10.5h.5V25H68z'/></svg>">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* IFrame ditempatkan tepat di mini art agar lolos Autoplay Policy */
    #yt-holder {
      width: 52px;
      height: 52px;
      position: absolute;
      left: 20px;
      bottom: 19px;
      z-index: 45;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #yt-holder iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 860px) {
      #yt-holder {
        left: 18px;
        bottom: calc(var(--navm-h) + 18px);
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-box">
        <div class="logo">
          <div style="width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#fa233b,#fb5c74);display:flex;align-items:center;justify-content:center;">
            <svg style="width:20px;height:20px;fill:#fff" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <span>IMusic</span>
        </div>
        <nav id="nav-desktop">
          <button class="nav-item active" data-id="home"><span>Home</span></button>
          <button class="nav-item" data-id="search"><span>Search</span></button>
        </nav>
      </div>
    </aside>

    <main id="main">
      <div id="topbar">
        <button type="button" id="tb-search" class="tb-search">
          <span>Cari lagu, artis, playlist...</span>
        </button>
      </div>
      <div id="view"></div>
    </main>

    <!-- Player Bar -->
    <div id="miniplayer">
      <div class="pb-left" style="margin-left: 60px;">
        <div class="mini-meta">
          <div id="mini-title">Pilih Lagu</div>
          <div id="mini-artist">IMusic Player</div>
        </div>
      </div>
      <div class="pb-center">
        <div class="pb-buttons">
          <button id="mini-prev" class="icon-btn">⏮</button>
          <button id="mini-play" class="play-circle">▶</button>
          <button id="mini-next" class="icon-btn">⏭</button>
        </div>
        <div class="pb-seek">
          <span id="mini-cur">0:00</span>
          <div class="pb-bar" id="mini-bar"><div id="mini-progress-fill"></div></div>
          <span id="mini-dur">0:00</span>
        </div>
      </div>
      <div class="pb-right">
        <input type="range" id="mini-volume" min="0" max="100" value="100" />
      </div>
    </div>

    <!-- YouTube IFrame Visible Element -->
    <div id="yt-holder"><div id="yt-player"></div></div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
